<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EVENT | REFLORIA DRIFT CHAMPIONSHIP</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.events-page{min-height:100vh;padding:135px 6vw 90px;background:radial-gradient(circle at 75% 10%,rgba(139,92,255,.14),transparent 32%),#06070b}
.event-head{border-left:2px solid #8b5cff;padding-left:22px;margin-bottom:42px}.event-kicker{font:800 11px Orbitron,sans-serif;letter-spacing:3px;color:#a879ff}.event-head h1{font:900 clamp(44px,6vw,82px) Orbitron,sans-serif;margin:12px 0}.event-head p{color:#9297a5}
.events-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.event-card{min-height:370px;padding:27px;background:linear-gradient(145deg,#0d0f16,#080a0f);border:1px solid rgba(255,255,255,.11);position:relative;overflow:hidden}.event-card:first-child{border-color:#8b5cff;box-shadow:0 0 45px rgba(139,92,255,.08)}.event-card:after{content:"";position:absolute;width:220px;height:220px;right:-100px;bottom:-100px;background:radial-gradient(circle,rgba(50,200,255,.12),transparent 70%)}.event-no{font:800 10px Orbitron,sans-serif;letter-spacing:2px;color:#a879ff}.event-date{font:800 24px Orbitron,sans-serif;margin-top:18px}.event-time{color:#32c8ff;font-size:12px;margin-left:7px}.event-card h2{font:900 26px/1.2 "Noto Sans JP",sans-serif;margin:20px 0 12px}.event-place{color:#c8ccd5;font-size:14px}.event-host{margin-top:20px;font:600 10px Orbitron,sans-serif;color:#a5aab7}.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:22px}.tag{font:700 9px Orbitron,sans-serif;padding:7px 9px;border:1px solid rgba(139,92,255,.55);color:#d8c9ff}.event-desc{color:#9297a5;font-size:12px;line-height:1.8;margin-top:20px}.empty{color:#9297a5;border:1px dashed rgba(255,255,255,.18);padding:30px}.past-note{margin-top:24px;color:#626875;font:600 10px Orbitron,sans-serif;letter-spacing:1px}
@media(max-width:1000px){.events-grid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.events-grid{grid-template-columns:1fr}.events-page{padding:115px 5vw 60px}}
</style>
</head>
<body>
<div class="noise"></div>
<header class="site-header" id="top">
<a class="brand" href="index.html"><span class="brand-mark">R</span><span><strong>REFLORIA</strong><small>DRIFT CHAMPIONSHIP</small></span></a>
<button class="menu-toggle" aria-label="メニューを開く" aria-expanded="false"><span></span><span></span><span></span></button>
<nav class="nav"><a href="index.html">HOME</a><a class="active" href="event.html">EVENT</a><a href="drivers.html">DRIVERS</a><a href="tournament.html">TOURNAMENT</a><a href="result.html">RESULT</a><a href="gallery.html">GALLERY</a><a href="news.html">NEWS</a></nav>
</header>
<main class="events-page">
<div class="event-head"><div class="event-kicker">EVENT / UPCOMING</div><h1>UPCOMING EVENTS</h1><p>これから開催されるイベントを最大3件表示します。</p></div>
<div id="eventsGrid" class="events-grid"><div class="empty">イベントを読み込み中...</div></div>
<div class="past-note">開催日を過ぎたイベントは自動的に一覧から外れ、次のイベントが繰り上がります。</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script><script src="events.js"></script>
<script>
(async()=>{
 const events=await loadRefloriaEvents(), grid=document.getElementById('eventsGrid');
 if(!events.length){grid.innerHTML='<div class="empty">現在、予定されているイベントはありません。</div>';return}
 grid.innerHTML=events.map((e,i)=>`<article class="event-card">
 <div class="event-no">EVENT ${String(i+1).padStart(2,'0')}</div>
 <div class="event-date">${formatShort(e.event_date)} <span class="event-time">${esc(e.event_time)}</span></div>
 <h2>${esc(e.event_name)}</h2><div class="event-place">📍 ${esc(e.event_location)}</div>
 <div class="event-host">HOST / ${esc(e.host || '—')} / ${esc(e.prize || '—')}</div>
 <div class="tags">${eventTags(e).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
 <p class="event-desc">${esc(e.description || '')}</p>
 </article>`).join('');
})();
</script>
</body></html>
