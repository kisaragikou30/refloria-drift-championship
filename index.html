<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Refloria DRIFT CHAMPIONSHIP - FiveM City Drift Championship" />
  <title>Refloria DRIFT CHAMPIONSHIP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
<style>
.hero{min-height:calc(100vh - 62px)}
.hero-image-wrap{display:block}
</style>
</head>
<body>
  <div class="noise"></div>
  <header class="site-header" id="top">
    <a class="brand" href="index.html" aria-label="Refloria DRIFT CHAMPIONSHIP">
      <span class="brand-mark">R</span>
      <span>
        <strong>REFLORIA</strong>
        <small>DRIFT CHAMPIONSHIP</small>
      </span>
    </a>

    <button class="menu-toggle" aria-label="メニューを開く" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <nav class="nav">
      <a class="active" href="index.html">HOME</a>
      <a href="event.html">EVENT</a>
      <a href="drivers.html">DRIVERS</a>
      <a href="tournament.html">TOURNAMENT</a>
      <a href="result.html">RESULT</a>
      <a href="gallery.html">GALLERY</a>
      <a href="news.html">NEWS</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="hero-grid"></div>
      <div class="hero-glow glow-one"></div>
      <div class="hero-glow glow-two"></div>
      <div class="hero-image-wrap">
        <img class="hero-car" src="hero-car.png" alt="Refloria Drift Championship hero car" />
        <div class="hero-image-vignette"></div>
      </div>

      <div class="hero-content reveal">
        <p class="eyebrow"><span></span> FIVE M CITY DRIFT SERIES</p>
        <h1>
          <span>REFLORIA</span>
          <em>DRIFT</em>
          <strong>CHAMPIONSHIP</strong>
        </h1>
        <p class="hero-copy">
          THE CITY'S BEST DRIFT DRIVER.<br>
          <span>ONE LINE. ONE STYLE. ONE CHAMPION.</span>
        </p>
      </div>
      </div>
      </section>
  </main>
  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="events.js"></script>
  <script>
  (async()=>{
    const events = await loadRefloriaEvents();
    if(!events.length) return;
    const e = events[0];
    document.getElementById('nextDate').textContent = formatDate(e.event_date);
    document.getElementById('nextTime').textContent = e.event_time || '';
    document.getElementById('nextLocation').textContent = e.event_location || '—';
  })();
  </script>
</body>
</html>
