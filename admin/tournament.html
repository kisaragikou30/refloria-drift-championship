<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REFLORIA TOURNAMENT ADMIN</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
window.REFLORIA_SUPABASE_URL="https://sofeiqphjhtocnigrpsg.supabase.co";window.REFLORIA_SUPABASE_KEY="sb_publishable_Mg7xnlC0bCfYkWjO6CAAZQ_sqaTXkBm";
</script><style>
*{box-sizing:border-box}body{margin:0;background:#06070b;color:#f4f5f7;font-family:Arial,"Noto Sans JP",sans-serif}.wrap{max-width:1250px;margin:auto;padding:30px 20px}.brand{font-size:38px;font-weight:900}.brand span{color:#8b5cff}.panel{background:#0c0e14;border:1px solid #252936;padding:22px;margin:18px 0}h2{margin-top:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}label{display:block;color:#9297a5;font-size:12px;margin:8px 0 5px}input,select{width:100%;padding:10px;background:#080a0f;border:1px solid #303442;color:#fff}button{padding:10px 14px;background:#8b5cff;color:#fff;border:0;font-weight:800;cursor:pointer;margin:4px}.danger{background:#651d2a}.secondary{background:#1a1e29}.note,.msg{font-size:12px;color:#9297a5}.msg{color:#32c8ff}.error{color:#ff8797}.hidden{display:none}.entry{width:100%;border-collapse:collapse;margin-top:15px}.entry th,.entry td{border:1px solid #252936;padding:7px}.entry th{color:#a879ff}.history{display:flex;gap:10px;align-items:center;border:1px solid #252936;background:#080a0f;padding:10px;margin:8px 0}.history strong{flex:1}.bracket{display:flex;gap:15px;overflow:auto}.round{min-width:210px}.match{background:#080a0f;border:1px solid #252936;padding:9px;margin-bottom:10px}.match button{display:block;width:100%;background:#171a24;border:1px solid #303442;text-align:left}.sel{color:#32c8ff!important;border-color:#32c8ff!important}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:550px){.grid{grid-template-columns:1fr}.brand{font-size:28px}}
</style></head><body><div class="wrap"><div class="brand">REFLORIA <span>TOURNAMENT ADMIN</span></div>
<section id="login" class="panel"><h2>ADMIN LOGIN</h2><p id="status" class="note">接続確認中...</p><label>メール</label><input id="email" type="email"><label>パスワード</label><input id="pass" type="password"><br><button id="loginBtn">LOGIN</button><div id="loginMsg" class="msg"></div></section>
<div id="app" class="hidden"><section class="panel"><div style="display:flex"><h2 style="flex:1">大会作成 / 単走採点</h2><button id="logout" class="danger">LOGOUT</button></div><p class="note">合計点を第一順位、同点なら最高点で順位決定。順位をそのままトーナメントのシードにします。</p>
<div class="grid"><div><label>参加人数</label><input id="count" type="number" min="2" max="64" value="8"></div><div><label>敗者復活</label><select id="losers"><option value="false">なし</option><option value="true">あり</option></select></div><div><label>3位決定戦</label><select id="third"><option value="true">あり</option><option value="false">なし</option></select></div><div><label>大会名</label><input id="name" value="REFLORIA DRIFT CHAMPIONSHIP"></div></div>
<table class="entry"><thead><tr><th>#</th><th>選手名</th><th>車両</th><th>1走目</th><th>2走目</th><th>最高点</th><th>順位</th></tr></thead><tbody id="body"></tbody></table>
<button id="gen">点数から順位決定 → トーナメント生成</button><button id="scoreSave" class="secondary">点数だけ保存</button><div id="msg" class="msg"></div></section>
<section class="panel"><h2>過去の大会</h2><div id="history" class="note">読み込み中...</div></section>
<section class="panel"><h2>勝敗入力</h2><div id="editor" class="note">大会を選択してください。</div></section></div></div>
<script>
const db=supabase.createClient(window.REFLORIA_SUPABASE_URL,window.REFLORIA_SUPABASE_KEY),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let current=null;
function msg(x,e=false){$('msg').textContent=x;$('msg').className='msg'+(e?' error':'')}
function rows(){return[...document.querySelectorAll('#body tr')].map((tr,i)=>({tr,name:tr.querySelector('.name').value.trim(),car:tr.querySelector('.car').value.trim(),r1:+tr.querySelector('.run1').value||0,r2:+tr.querySelector('.run2').value||0,i})).filter(x=>x.name).map(x=>({...x,highest:Math.max(x.r1,x.r2),total:x.r1+x.r2})).sort((a,b)=>b.highest-a.highest||b.total-a.total||a.i-b.i)}
function ranks(){let a=rows();document.querySelectorAll('.rank').forEach(x=>x.textContent='-');a.forEach((x,i)=>{x.tr.querySelector('.rank').textContent=i+1+'位';x.tr.querySelector('.highest').textContent=x.highest});return a}
function makeRows(n,old=[]){let h='';for(let i=0;i<n;i++){let x=old[i]||{},r1=x.r1??x.run1_highest??0,r2=x.r2??x.run2_highest??0;h+='<tr><td>'+(i+1)+'</td><td><input class="name" value="'+esc(x.name??x.driver_name??'')+'" placeholder="選手名"></td><td><input class="car" value="'+esc(x.car||'')+'" placeholder="S15"></td><td><input class="run1" type="number" step=".01" value="'+r1+'"></td><td><input class="run2" type="number" step=".01" value="'+r2+'"></td><td class="highest">'+Math.max(+r1||0,+r2||0)+'</td><td class="rank">-</td></tr>'}$('body').innerHTML=h}
makeRows(8);$('count').oninput=()=>makeRows(Math.max(2,Math.min(64,+$('count').value||2)));
document.addEventListener('input',e=>{if(e.target.closest('#body'))ranks()});
function bracket(a,losers,third){let n=a.length,p=1;while(p<n)p*=2;let s=[];for(let i=0;i<Math.ceil(n/2);i++){let j=n-1-i;s.push(a[i].name);if(j!==i)s.push(a[j].name)}while(s.length<p)s.push('BYE');let rs=[],m=[];for(let i=0;i<p;i+=2){let x=s[i],y=s[i+1];m.push({a:x,b:y,winner:y==='BYE'?x:x==='BYE'?y:null})}rs.push({matches:m});for(let c=p/2;c>1;c/=2){let z=[];for(let i=0;i<c;i+=2)z.push({a:null,b:null,winner:null});rs.push({matches:z})}let b={playerCount:n,rounds:rs,thirdPlace:third?{a:null,b:null,winner:null}:null,losers:[]};if(losers)b.losers=[{matches:[]}];advance(b);return b}
function semifinalLoser(m){if(!m||!m.winner)return null;return m.a===m.winner?m.b:m.a}
function advance(b){for(let r=0;r<b.rounds.length-1;r++)b.rounds[r].matches.forEach((m,i)=>b.rounds[r+1].matches[Math.floor(i/2)][i%2?'b':'a']=m.winner||null);if(b.thirdPlace&&b.rounds.length>1){let s=b.rounds[b.rounds.length-2].matches;if(s.length>1){b.thirdPlace.a=semifinalLoser(s[0]);b.thirdPlace.b=semifinalLoser(s[1]);if(b.thirdPlace.winner&&b.thirdPlace.winner!==b.thirdPlace.a&&b.thirdPlace.winner!==b.thirdPlace.b)b.thirdPlace.winner=null}}}
async function saveEntries(id,a){await db.from('tournament_entries').delete().eq('tournament_id',id);let r=await db.from('tournament_entries').insert(a.map((x,i)=>({tournament_id:id,seed:i+1,driver_name:x.name,car:x.car,run1_highest:x.r1,run2_highest:x.r2,solo_total:x.total,solo_highest:x.highest,final_position:i+1})));if(r.error)throw r.error}
$('gen').onclick=async()=>{try{let a=ranks(),n=+$('count').value;if(a.length!==n)throw Error(n+'人分の選手名を入力してください');let p={name:$('name').value||'TOURNAMENT',player_count:n,losers_bracket:$('losers').value==='true',third_place_match:$('third').value==='true',bracket_data:bracket(a,$('losers').value==='true',$('third').value==='true'),updated_at:new Date().toISOString()};let r=current?await db.from('tournaments').update(p).eq('id',current.id).select().single():await db.from('tournaments').insert(p).select().single();if(r.error)throw r.error;current=r.data;await saveEntries(current.id,a);msg('生成しました ✓');loadHistory();render()}catch(e){msg(e.message,true)}};
$('scoreSave').onclick=async()=>{try{if(!current)throw Error('先に大会を生成してください');await saveEntries(current.id,ranks());msg('点数を保存しました ✓')}catch(e){msg(e.message,true)}};
async function loadHistory(){let r=await db.from('tournaments').select('*').order('created_at',{ascending:false});if(r.error){msg(r.error.message,true);return}$('history').innerHTML=(r.data||[]).map(t=>'<div class="history"><strong>'+esc(t.name)+' ('+t.player_count+'人)</strong><button data-open="'+t.id+'" class="secondary">開く</button><button data-del="'+t.id+'" class="danger">削除</button></div>').join('')||'過去大会なし';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openTournament(+b.dataset.open));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delTournament(+b.dataset.del))}
async function openTournament(id){let t=await db.from('tournaments').select('*').eq('id',id).single(),e=await db.from('tournament_entries').select('*').eq('tournament_id',id).order('seed');if(t.error||e.error)return msg((t.error||e.error).message,true);current=t.data;advance(current.bracket_data);await db.from('tournaments').update({bracket_data:current.bracket_data}).eq('id',id);$('name').value=current.name;$('count').value=current.player_count;$('losers').value=String(current.losers_bracket);$('third').value=String(current.third_place_match);makeRows(current.player_count,e.data||[]);ranks();render()}
async function delTournament(id){if(!confirm('この大会の単走点・順位・トーナメント結果を全部削除します。よろしいですか？'))return;let a=await db.from('tournament_entries').delete().eq('tournament_id',id);if(a.error)return msg('選手データ削除エラー: '+a.error.message,true);let r=await db.from('tournaments').delete().eq('id',id);if(r.error)return msg('大会削除エラー: '+r.error.message,true);if(current?.id===id){current=null;$('editor').textContent='大会を選択してください'}msg('大会を削除しました ✓');loadHistory()}
async function saveBracket(){let r=await db.from('tournaments').update({bracket_data:current.bracket_data,updated_at:new Date().toISOString()}).eq('id',current.id).select().single();if(r.error)msg(r.error.message,true);else current=r.data}
function render(){if(!current){$('editor').textContent='大会を選択してください';return}let b=current.bracket_data,h='<div class="bracket">';b.rounds.forEach((r,ri)=>{h+='<div class="round"><h3>ROUND '+(ri+1)+'</h3>';r.matches.forEach((m,mi)=>h+='<div class="match"><small>MATCH '+(mi+1)+'</small><button data-w="'+ri+':'+mi+':a" class="'+(m.winner===m.a?'sel':'')+'">'+esc(m.a||'TBD')+'</button><button data-w="'+ri+':'+mi+':b" class="'+(m.winner===m.b?'sel':'')+'">'+esc(m.b||'TBD')+'</button></div>');h+='</div>'});h+='</div>';if(b.thirdPlace){h+='<h3>🥉 3位決定戦</h3><div class="match"><button data-t="a" class="'+(b.thirdPlace.winner===b.thirdPlace.a?'sel':'')+'" '+((!b.thirdPlace.a||!b.thirdPlace.b)?'disabled':'')+'>'+esc(b.thirdPlace.a||'TBD')+'</button><button data-t="b" class="'+(b.thirdPlace.winner===b.thirdPlace.b?'sel':'')+'" '+((!b.thirdPlace.a||!b.thirdPlace.b)?'disabled':'')+'>'+esc(b.thirdPlace.b||'TBD')+'</button></div>';}$('editor').innerHTML=h;document.querySelectorAll('[data-w]').forEach(x=>x.onclick=async()=>{let [r,m,s]=x.dataset.w.split(':'),q=current.bracket_data.rounds[+r].matches[+m],w=s==='a'?q.a:q.b;if(!w||w==='TBD'||w==='BYE')return;q.winner=w;advance(current.bracket_data);await saveBracket();render()});document.querySelectorAll('[data-t]').forEach(x=>x.onclick=async()=>{let w=x.dataset.t==='a'?b.thirdPlace.a:b.thirdPlace.b;if(!w||w==='TBD')return;if(!b.thirdPlace.a||!b.thirdPlace.b)return msg('3位決定戦の両選手が決まってから勝者を選択してください',true);b.thirdPlace.winner=w;await saveBracket();render()})}
$('loginBtn').onclick=async()=>{try{let r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});if(r.error)throw r.error;$('login').classList.add('hidden');$('app').classList.remove('hidden');loadHistory()}catch(e){$('loginMsg').textContent=e.message;$('loginMsg').className='msg error'}};
$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};(async()=>{try{$('status').textContent='Supabase接続OK';let s=await db.auth.getSession();if(s.data.session){$('login').classList.add('hidden');$('app').classList.remove('hidden');loadHistory()}}catch(e){$('status').textContent=e.message}})();
</script></body></html>
