<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REFLORIA TOURNAMENT ADMIN</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#06070b;color:#f4f5f7;font-family:Arial,"Noto Sans JP",sans-serif}.wrap{max-width:1200px;margin:auto;padding:35px 20px}.brand{font-weight:900;font-size:38px;margin-bottom:28px}.brand span{color:#8b5cff}.panel{background:#0c0e14;border:1px solid #252936;padding:24px;margin-bottom:18px}h2{margin:0 0 16px;font-size:24px}h3{margin:0 0 12px}.note{color:#9297a5;font-size:12px;line-height:1.7}label{display:block;color:#9297a5;font-size:12px;margin:13px 0 6px}input,select{width:100%;padding:12px;background:#080a0f;border:1px solid #303442;color:#fff;border-radius:0}button{padding:12px 18px;background:#8b5cff;color:#fff;border:0;font-weight:800;cursor:pointer}button:hover{filter:brightness(1.12)}button:disabled{opacity:.5;cursor:not-allowed}.danger{background:#551c28}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.full{grid-column:1/-1}.seed-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.seed{border:1px solid #252936;background:#080a0f;padding:10px}.seed b{display:block;color:#a879ff;font-size:11px;margin-bottom:6px}.msg{margin-top:12px;color:#32c8ff;min-height:18px}.error{color:#ff8797}.hidden{display:none}.matches{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.match{background:#080a0f;border:1px solid #252936;padding:12px}.match strong{display:block;color:#a879ff;font-size:10px;margin-bottom:8px}.match button{width:100%;margin-top:6px;background:#171a24;border:1px solid #34384a}.match button.sel{border-color:#32c8ff;color:#32c8ff}.login-status{padding:10px;background:#080a0f;border:1px solid #252936;margin-bottom:15px;color:#32c8ff}@media(max-width:800px){.grid,.matches,.seed-grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.matches,.seed-grid{grid-template-columns:1fr}.brand{font-size:28px}}
</style>
</head>
<body>
<div class="wrap">
<div class="brand">REFLORIA <span>TOURNAMENT ADMIN</span></div>

<section id="loginPanel" class="panel">
<h2>ADMIN LOGIN</h2>
<div id="loginStatus" class="login-status">接続確認中...</div>
<label>メールアドレス</label><input id="email" type="email">
<label>パスワード</label><input id="password" type="password">
<br><br><button id="loginBtn" type="button">LOGIN</button>
<div id="loginMsg" class="msg"></div>
</section>

<div id="app" class="hidden">
<section class="panel">
<div style="display:flex;gap:10px;align-items:center"><h2 style="flex:1">TOURNAMENT GENERATOR</h2><button id="logoutBtn" class="danger" type="button">LOGOUT</button></div>
<p class="note">参加人数を決めて、下の順位順に選手名を入力してください。8人なら「1位vs8位、2位vs7位、3位vs6位、4位vs5位」で組みます。</p>
<div class="grid">
<div><label>参加人数</label><input id="count" type="number" min="2" max="64" value="8"></div>
<div><label>敗者復活</label><select id="losers"><option value="false">なし</option><option value="true">あり</option></select></div>
<div><label>3位決定戦</label><select id="third"><option value="true">あり</option><option value="false">なし</option></select></div>
<div class="full"><label>大会名</label><input id="name" value="REFLORIA DRIFT CHAMPIONSHIP"></div>
<div class="full">
<label>出場選手・順位</label>
<p class="note">上が高順位です。人数を変更すると必要な欄だけ表示されます。</p>
<div id="seedGrid" class="seed-grid">
<!-- 64 inputs are intentionally present in HTML so this screen works even if dynamic rendering fails -->
<script>
for(let i=1;i<=64;i++){
 document.write('<div class="seed" data-seed-wrap="'+i+'"><b>'+i+'位</b><input class="seedPlayer" data-seed="'+i+'" placeholder="'+i+'位の選手名"></div>');
}
</script>
</div>
</div>
<div class="full"><button id="generateBtn" type="button">トーナメントを生成 / 更新</button></div>
</div>
<div id="genMsg" class="msg"></div>
</section>

<section class="panel"><h2>出場選手</h2><div id="players" class="note">読み込み中...</div></section>
<section class="panel"><h2>勝敗入力</h2><p class="note">勝った選手を押すと次のラウンドへ進みます。</p><div id="editor"><p class="note">トーナメントを生成してください。</p></div></section>
</div>
</div>

<script>
(function(){
let db=null,current=null,drivers=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function setMsg(id,text,error=false){$(id).textContent=text;$(id).className='msg'+(error?' error':'');}
function pow2(n){let p=1;while(p<n)p*=2;return p;}

function showSeedRows(){
 const n=Math.max(2,Math.min(64,Number($('count').value)||2));
 document.querySelectorAll('[data-seed-wrap]').forEach((el,i)=>el.style.display=i<n?'block':'none');
}
$('count').addEventListener('input',showSeedRows); showSeedRows();

function makeBracket(names,losers,third){
 const size=pow2(names.length), seeds=[...names];
 while(seeds.length<size)seeds.push('BYE');
 const rounds=[];let first=[];
 for(let i=0;i<size;i+=2){
  const a=seeds[i],b=seeds[i+1];
  first.push({a,b,winner:b==='BYE'?a:a==='BYE'?b:null});
 }
 rounds.push({matches:first});
 for(let c=size/2;c>1;c/=2){let r=[];for(let i=0;i<c;i+=2)r.push({a:null,b:null,winner:null});rounds.push({matches:r});}
 const b={playerCount:names.length,rounds,thirdPlace:third?{a:null,b:null,winner:null}:null,losers:[]};
 if(losers){for(let c=Math.max(2,size/2);c>=2;c=Math.floor(c/2)){let r=[];for(let i=0;i<c/2;i++)r.push({a:null,b:null,winner:null});b.losers.push({matches:r});}}
 advance(b);return b;
}
function advance(b){
 for(let ri=0;ri<b.rounds.length-1;ri++){
  b.rounds[ri].matches.forEach((m,mi)=>{let n=Math.floor(mi/2),side=mi%2?'b':'a';b.rounds[ri+1].matches[n][side]=m.winner||null;});
 }
 if(b.thirdPlace&&b.rounds.length>=2){let s=b.rounds[b.rounds.length-2].matches;if(s.length>=2){b.thirdPlace.a=s[0].winner||null;b.thirdPlace.b=s[1].winner||null;}}
}
function renderEditor(){
 if(!current){$('editor').innerHTML='<p class="note">トーナメントを生成してください。</p>';return;}
 const b=current.bracket_data||{};let h='<div class="matches">';
 (b.rounds||[]).forEach((r,ri)=>r.matches.forEach((m,mi)=>{
  h+='<div class="match"><strong>ROUND '+(ri+1)+' / MATCH '+(mi+1)+'</strong>'+
  '<button type="button" data-pick="'+ri+':'+mi+':a" class="'+(m.winner===m.a&&m.a?'sel':'')+'">'+esc(m.a||'TBD')+'</button>'+
  '<button type="button" data-pick="'+ri+':'+mi+':b" class="'+(m.winner===m.b&&m.b?'sel':'')+'">'+esc(m.b||'TBD')+'</button></div>';
 }));
 h+='</div>';
 if(b.thirdPlace)h+='<div style="margin-top:20px"><h3>🥉 3位決定戦</h3><div class="match"><button type="button" data-third="a">'+esc(b.thirdPlace.a||'TBD')+'</button><button type="button" data-third="b">'+esc(b.thirdPlace.b||'TBD')+'</button></div></div>';
 $('editor').innerHTML=h;
 document.querySelectorAll('[data-pick]').forEach(btn=>btn.onclick=async()=>{
  let [ri,mi,side]=btn.dataset.pick.split(':'),m=current.bracket_data.rounds[+ri].matches[+mi],w=side==='a'?m.a:m.b;
  if(!w||w==='BYE'||w==='TBD')return setMsg('genMsg','まだ選手が決まっていません。',true);
  m.winner=w;advance(current.bracket_data);await save();renderEditor();
 });
 document.querySelectorAll('[data-third]').forEach(btn=>btn.onclick=async()=>{
  let t=current.bracket_data.thirdPlace,w=btn.dataset.third==='a'?t.a:t.b;if(!w)return;
  t.winner=w;await save();renderEditor();
 });
}
async function save(){
 let r=await db.from('tournaments').update({bracket_data:current.bracket_data,updated_at:new Date().toISOString()}).eq('id',current.id).select().single();
 if(r.error){setMsg('genMsg','保存失敗: '+r.error.message,true);return;}current=r.data;setMsg('genMsg','保存しました ✓');
}
async function loadDrivers(){
 let r=await db.from('drivers').select('number,name,car').order('id');
 if(r.error){setMsg('genMsg','選手読み込み失敗: '+r.error.message,true);return;}
 drivers=r.data||[];$('players').innerHTML=drivers.length?drivers.map(d=>'#'+esc(d.number)+' '+esc(d.name)+' / '+esc(d.car||'—')).join('<br>'):'登録選手はいません。';
}
async function loadCurrent(){
 let r=await db.from('tournaments').select('*').order('updated_at',{ascending:false}).limit(1).maybeSingle();
 if(r.error){setMsg('genMsg','トーナメント読み込み失敗: '+r.error.message,true);return;}
 current=r.data||null;
 if(current){$('count').value=current.player_count||8;$('name').value=current.name||'REFLORIA DRIFT CHAMPIONSHIP';$('losers').value=String(!!current.losers_bracket);$('third').value=String(!!current.third_place_match);}
 showSeedRows();renderEditor();
}
async function openApp(){$('loginPanel').classList.add('hidden');$('app').classList.remove('hidden');await loadDrivers();await loadCurrent();}
async function boot(){
 try{
  if(!window.supabase)throw new Error('Supabaseライブラリが読み込まれていません');
  if(!window.REFLORIA_SUPABASE_URL||!window.REFLORIA_SUPABASE_KEY)throw new Error('supabase-config.js がありません');
  db=window.supabase.createClient(window.REFLORIA_SUPABASE_URL,window.REFLORIA_SUPABASE_KEY);$('loginStatus').textContent='Supabase接続OK';
  let s=await db.auth.getSession();if(s.data.session)await openApp();
 }catch(e){$('loginStatus').textContent='エラー: '+e.message;}
}
$('loginBtn').onclick=async()=>{
 try{$('loginBtn').disabled=true;setMsg('loginMsg','ログイン中...');let r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;await openApp();}catch(e){setMsg('loginMsg',e.message,true)}finally{$('loginBtn').disabled=false;}
};
$('logoutBtn').onclick=async()=>{await db.auth.signOut();location.reload();};
$('generateBtn').onclick=async()=>{
 try{
  const n=Math.max(2,Math.min(64,Number($('count').value)||2));
  const names=[...document.querySelectorAll('.seedPlayer')].slice(0,n).map(x=>x.value.trim());
  if(names.some(x=>!x))throw new Error('1位〜'+n+'位まで、すべて選手名を入力してください。');
  if(new Set(names).size!==names.length)throw new Error('同じ選手名が複数あります。');
  // seed order: 1 vs N, 2 vs N-1, ...
  const seeded=[];for(let i=0;i<Math.ceil(n/2);i++){let j=n-1-i;seeded.push(names[i]);if(j!==i)seeded.push(names[j]);}
  const payload={name:$('name').value.trim()||'TOURNAMENT',player_count:n,losers_bracket:$('losers').value==='true',third_place_match:$('third').value==='true',bracket_data:makeBracket(seeded,$('losers').value==='true',$('third').value==='true'),updated_at:new Date().toISOString()};
  let r=current?await db.from('tournaments').update(payload).eq('id',current.id).select().single():await db.from('tournaments').insert(payload).select().single();
  if(r.error)throw r.error;current=r.data;renderEditor();setMsg('genMsg','トーナメントを生成しました ✓');
 }catch(e){setMsg('genMsg',e.message,true);}
};
boot();
})();
</script>
</body></html>
