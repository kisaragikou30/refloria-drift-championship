<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REFLORIA ADMIN / TOURNAMENT</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#06070b;color:#f4f5f7;font-family:Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:35px 20px}.brand{font:900 38px Orbitron,Arial;margin-bottom:25px}.brand span{color:#8b5cff}.panel{background:#0c0e14;border:1px solid #252936;padding:24px;margin-bottom:18px}h2{margin-top:0}label{display:block;color:#9297a5;font-size:12px;margin:13px 0 6px}input,select{width:100%;padding:11px;background:#080a0f;border:1px solid #303442;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.full{grid-column:1/-1}button{padding:11px 16px;background:#8b5cff;color:#fff;border:0;font-weight:800;cursor:pointer}.danger{background:#551c28}.msg{color:#32c8ff;margin-top:10px}.hidden{display:none}.matches{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.m{background:#080a0f;border:1px solid #252936;padding:12px}.m strong{display:block;color:#a879ff;font-size:10px;margin-bottom:8px}.m button{width:100%;margin-top:6px;background:#171a24;border:1px solid #34384a}.m button.sel{border-color:#32c8ff;color:#32c8ff}.row{display:flex;gap:10px;align-items:center}.note{color:#9297a5;font-size:12px;line-height:1.7}@media(max-width:800px){.grid,.matches{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.matches{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<div class="brand">REFLORIA <span>TOURNAMENT ADMIN</span></div>
<section id="login" class="panel"><h2>ADMIN LOGIN</h2><label>メールアドレス</label><input id="email" type="email"><label>パスワード</label><input id="password" type="password"><button id="loginBtn">LOGIN</button><div id="loginMsg" class="msg"></div></section>
<div id="app" class="hidden">
<section class="panel"><div class="row"><h2 style="margin:0;flex:1">TOURNAMENT GENERATOR</h2><button id="logout" class="danger">LOGOUT</button></div>
<p class="note">人数を入力すると自動で枠を作ります。BYEは自動配置。3位決定戦と敗者復活はON/OFFできます。</p>
<form id="form" class="grid">
<div><label>参加人数</label><input id="count" type="number" min="2" max="64" value="10"></div>
<div><label>敗者復活</label><select id="losers"><option value="false">なし</option><option value="true">あり</option></select></div>
<div><label>3位決定戦</label><select id="third"><option value="true">あり</option><option value="false">なし</option></select></div>
<div class="full"><label>大会名</label><input id="name" value="REFLORIA DRIFT CHAMPIONSHIP"></div>
<div class="full"><button>トーナメントを生成 / 更新</button></div>
</form><div id="msg" class="msg"></div></section>
<section class="panel"><h2>出場選手</h2><div id="players" class="note">選手を読み込み中...</div></section>
<section class="panel"><h2>勝敗入力</h2><p class="note">勝った選手を押すと次のラウンドへ進みます。</p><div id="editor"></div></section>
</div></div>
<script>
const db=supabase.createClient(window.REFLORIA_SUPABASE_URL,window.REFLORIA_SUPABASE_KEY),$=id=>document.getElementById(id);
let current=null, drivers=[];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function pow2(n){let p=1;while(p<n)p*=2;return p}
function makeBracket(list,losers,third){
 const size=pow2(list.length), seeds=[...list]; while(seeds.length<size)seeds.push('BYE');
 const rounds=[]; let first=[];
 for(let i=0;i<size;i+=2) first.push({a:seeds[i],b:seeds[i+1],winner:seeds[i+1]==='BYE'?seeds[i]:seeds[i]==='BYE'?seeds[i+1]:null});
 rounds.push({matches:first});
 let prev=size/2;
 while(prev>1){let r=[];for(let i=0;i<prev;i+=2)r.push({a:null,b:null,winner:null});rounds.push({matches:r});prev/=2}
 const b={playerCount:list.length,rounds,thirdPlace:third?{a:null,b:null,winner:null}:null,losers:[]};
 if(losers){
  let n=Math.max(1,size/2);
  while(n>=2){let r=[];for(let i=0;i<n/2;i++)r.push({a:null,b:null,winner:null});b.losers.push({matches:r});n=Math.floor(n/2)}
 }
 return b
}
function advance(b){
 for(let ri=0;ri<b.rounds.length-1;ri++){
  const cur=b.rounds[ri], next=b.rounds[ri+1];
  cur.matches.forEach((m,mi)=>{
   const w=m.winner;
   const ni=Math.floor(mi/2), side=mi%2?'b':'a';
   if(next.matches[ni][side]!==w) next.matches[ni][side]=w||null;
  });
  if(b.thirdPlace && ri===b.rounds.length-2){
   b.thirdPlace.a=cur.matches[0]?.winner||null;b.thirdPlace.b=cur.matches[1]?.winner||null;
  }
 }
}
function renderEditor(){
 if(!current){$('editor').innerHTML='<p class="note">まだトーナメントがありません。</p>';return}
 const b=current.bracket_data, rounds=b.rounds||[];
 let html='<div class="matches">';
 rounds.forEach((r,ri)=>r.matches.forEach((m,mi)=>{
  const a=m.a||'TBD', c=m.b||'TBD';
  html+=`<div class="m"><strong>ROUND ${ri+1} / MATCH ${mi+1}</strong>
  <button class="${m.winner===m.a&&m.a?'sel':''}" onclick="pick(${ri},${mi},'a')">${esc(a)}</button>
  <button class="${m.winner===m.b&&m.b?'sel':''}" onclick="pick(${ri},${mi},'b')">${esc(c)}</button></div>`;
 }));
 html+='</div>';
 if(b.thirdPlace)html+=`<div class="panel" style="margin-top:15px"><h3>🥉 3位決定戦</h3><div class="m"><button onclick="pickThird('a')">${esc(b.thirdPlace.a||'TBD')}</button><button onclick="pickThird('b')">${esc(b.thirdPlace.b||'TBD')}</button></div></div>`;
 if(current.losers_bracket)html+='<p class="note" style="margin-top:18px">敗者復活ON：敗者側の枠を生成済み。勝敗入力を次の拡張枠へ対応できます。</p>';
 $('editor').innerHTML=html;
}
async function save(){
 const {error}=await db.from('tournaments').update({bracket_data:current.bracket_data,updated_at:new Date().toISOString()}).eq('id',current.id);
 if(error)$('msg').textContent=error.message; else $('msg').textContent='勝敗を保存しました ✓';
}
window.pick=async(ri,mi,side)=>{
 const m=current.bracket_data.rounds[ri].matches[mi], w=side==='a'?m.a:m.b;
 if(!w||w==='BYE'||w==='TBD')return;
 m.winner=w; advance(current.bracket_data); renderEditor(); await save();
}
window.pickThird=async side=>{const t=current.bracket_data.thirdPlace;if(!t)return;const w=side==='a'?t.a:t.b;if(!w)return;t.winner=w;renderEditor();await save()}
async function loadDrivers(){const {data}=await db.from('drivers').select('number,name,car').order('id');drivers=data||[];$('players').innerHTML=drivers.map(d=>`#${esc(d.number)} ${esc(d.name)} / ${esc(d.car)}`).join('<br>')||'選手がいません';}
async function loadCurrent(){const {data}=await db.from('tournaments').select('*').order('updated_at',{ascending:false}).limit(1).maybeSingle();current=data||null;if(current){$('count').value=current.player_count;$('name').value=current.name;$('losers').value=String(current.losers_bracket);$('third').value=String(current.third_place_match)}renderEditor()}
$('loginBtn').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('loginMsg').textContent=error?error.message:'ログイン成功';if(!error){$('login').classList.add('hidden');$('app').classList.remove('hidden');await loadDrivers();await loadCurrent()}}
$('logout').onclick=async()=>{await db.auth.signOut();location.reload()}
$('form').onsubmit=async e=>{e.preventDefault();const n=Math.max(2,Math.min(64,+$('count').value||2));const list=drivers.slice(0,n).map(d=>`#${d.number} ${d.name}`);if(list.length<n){$('msg').textContent=`選手が${n}人必要です。現在${list.length}人です。`;return}const bracket=makeBracket(list,$('losers').value==='true',$('third').value==='true');const payload={name:$('name').value.trim()||'TOURNAMENT',player_count:n,losers_bracket:$('losers').value==='true',third_place_match:$('third').value==='true',bracket_data:bracket};let res;if(current)res=await db.from('tournaments').update(payload).eq('id',current.id).select().single();else res=await db.from('tournaments').insert(payload).select().single();if(res.error){$('msg').textContent=res.error.message;return}current=res.data;$('msg').textContent='トーナメントを生成しました ✓';renderEditor()}
async function start(){const {data}=await db.auth.getSession();if(data.session){$('login').classList.add('hidden');$('app').classList.remove('hidden');await loadDrivers();await loadCurrent()}}
start();
</script></body></html>
