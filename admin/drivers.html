<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REFLORIA DRIVERS ADMIN</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#06070b;color:#f4f5f7;font-family:Arial,"Noto Sans JP",sans-serif}.wrap{max-width:1200px;margin:auto;padding:35px 20px}.brand{font-weight:900;font-size:38px;margin-bottom:28px}.brand span{color:#8b5cff}.panel{background:#0c0e14;border:1px solid #252936;padding:24px;margin-bottom:18px}h2{margin:0 0 16px}.note{color:#9297a5;font-size:12px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}label{display:block;color:#9297a5;font-size:12px;margin:13px 0 6px}input{width:100%;padding:12px;background:#080a0f;border:1px solid #303442;color:#fff}button{padding:12px 18px;background:#8b5cff;color:#fff;border:0;font-weight:800;cursor:pointer}.danger{background:#551c28}.msg{margin-top:12px;color:#32c8ff;min-height:18px}.error{color:#ff8797}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{border-bottom:1px solid #252936;padding:13px 10px;text-align:left}th{color:#9297a5;font-size:12px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.brand{font-size:28px}}
</style></head><body><div class="wrap">
<div class="brand">REFLORIA <span>DRIVERS ADMIN</span></div>
<section class="panel"><h2>選手登録</h2><p class="note">番号・名前・車種・チームを登録できます。登録済み選手は個別に削除できます。</p>
<div class="grid"><div><label>番号</label><input id="number" type="number" placeholder="7"></div><div><label>名前</label><input id="name" placeholder="如月こう"></div><div><label>車種</label><input id="car" placeholder="S15"></div><div><label>チーム</label><input id="team" placeholder="REFLORIA"></div></div>
<button id="addBtn" style="margin-top:18px">ADD</button><div id="msg" class="msg"></div></section>
<section class="panel"><h2>登録選手</h2><div id="list">読み込み中...</div></section></div>
<script>
const $=id=>document.getElementById(id);let db=null;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function msg(t,e=false){$('msg').textContent=t;$('msg').className='msg'+(e?' error':'');}
async function load(){let r=await db.from('drivers').select('id,number,name,car,team').order('number',{ascending:true});if(r.error){$('list').textContent='読み込み失敗: '+r.error.message;return}let a=r.data||[];if(!a.length){$('list').textContent='登録選手はいません。';return}$('list').innerHTML='<table><thead><tr><th>番号</th><th>名前</th><th>車種</th><th>チーム</th><th>操作</th></tr></thead><tbody>'+a.map(d=>'<tr><td>#'+esc(d.number)+'</td><td>'+esc(d.name)+'</td><td>'+esc(d.car||'—')+'</td><td>'+esc(d.team||'—')+'</td><td><button class="danger" onclick="removeDriver('+d.id+')">削除</button></td></tr>').join('')+'</tbody></table>'}
async function removeDriver(id){if(!confirm('この選手を削除しますか？'))return;let r=await db.from('drivers').delete().eq('id',id);if(r.error){msg('削除失敗: '+r.error.message,true);return}msg('削除しました ✓');load()}
$('addBtn').onclick=async()=>{let number=+$('number').value,name=$('name').value.trim(),car=$('car').value.trim(),team=$('team').value.trim();if(!number||!name){msg('番号と名前を入力してください。',true);return}$('addBtn').disabled=true;let r=await db.from('drivers').insert({number,name,car,team});$('addBtn').disabled=false;if(r.error){msg('登録失敗: '+r.error.message,true);return}$('number').value='';$('name').value='';$('car').value='';$('team').value='';msg('登録しました ✓');load()};
async function boot(){if(!window.supabase||!window.REFLORIA_SUPABASE_URL||!window.REFLORIA_SUPABASE_KEY){msg('Supabase設定を読み込めません。',true);return}db=window.supabase.createClient(window.REFLORIA_SUPABASE_URL,window.REFLORIA_SUPABASE_KEY);let s=await db.auth.getSession();if(!s.data.session){msg('ログインが必要です。既存の管理画面でログインしてください。',true);$('addBtn').disabled=true;return}load()}boot();
</script></body></html>
