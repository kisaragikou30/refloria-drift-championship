<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>REFLORIA ADMIN V4</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#06070b;color:#f4f5f7;font-family:Arial,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:40px 22px}.brand{font-size:42px;font-weight:900;margin-bottom:35px}.brand span{color:#8b5cff}
.panel{border:1px solid #252936;background:#0c0e14;padding:28px;margin-bottom:22px}
h2{margin-top:0}label{display:block;color:#9297a5;font-size:13px;margin:14px 0 6px}
input,textarea{width:100%;padding:12px;background:#080a0f;border:1px solid #303442;color:#fff;border-radius:2px}
button{background:#8b5cff;color:#fff;border:0;padding:11px 18px;cursor:pointer;font-weight:700;margin-top:16px}
button:hover{opacity:.85}.tabs{display:flex;gap:8px;margin-bottom:22px}.tabs button{background:#11141c;border:1px solid #35384a}.tabs button.active{border-color:#8b5cff}
#app{display:none}.msg{color:#32c8ff;margin-top:12px}.driver{display:grid;grid-template-columns:90px 1fr 1fr 80px;gap:12px;align-items:center;border-top:1px solid #242732;padding:15px 0}.driver button{margin:0;background:#271522}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}
@media(max-width:700px){.grid{grid-template-columns:1fr}.driver{grid-template-columns:60px 1fr}.driver span{grid-column:2}.driver button{grid-column:2}}
</style>
</head>
<body>
<div class="wrap">
<div class="brand">REFLORIA <span>ADMIN</span></div>

<section id="login" class="panel">
<h2>ADMIN LOGIN</h2><p>管理者だけが大会情報と選手情報を変更できます。</p>
<label>メールアドレス</label><input id="email" type="email">
<label>パスワード</label><input id="password" type="password">
<button id="loginBtn">LOGIN</button><div id="loginMsg" class="msg"></div>
</section>

<div id="app">
<div class="tabs">
<button class="active" data-tab="event">大会情報</button>
<button data-tab="drivers">選手管理</button>
<button id="logout">LOGOUT</button>
</div>

<section id="eventPanel" class="panel">
<h2>大会情報</h2>
<form id="eventForm" class="grid">
<div><label>イベント名</label><input id="eventName"></div>
<div><label>開催日</label><input id="eventDate" type="date"></div>
<div><label>時間</label><input id="eventTime" type="time"></div>
<div><label>場所</label><input id="eventLocation"></div>
<div><label>主催</label><input id="eventHost"></div>
<div><label>賞金</label><input id="eventPrize"></div>
<div class="full"><label>説明</label><textarea id="eventDescription"></textarea></div>
<div class="full"><button>SAVE EVENT</button></div>
</form><div id="eventMsg" class="msg"></div>
</section>

<section id="driversPanel" class="panel" style="display:none">
<h2>選手管理</h2>
<p>公開サイトに反映するのは「番号・選手名・主な車種」の3つだけ。</p>
<form id="driverForm" class="grid">
<div><label>番号</label><input id="driverNumber" required placeholder="例：7"></div>
<div><label>選手名</label><input id="driverName" required placeholder="例：如月"></div>
<div class="full"><label>主な車種</label><input id="driverCar" required placeholder="例：S15"></div>
<div class="full"><button>ADD DRIVER</button></div>
</form>
<div id="driverMsg" class="msg"></div>
<div id="driverList"></div>
</section>
</div>
</div>

<script>
const client=supabase.createClient(window.REFLORIA_SUPABASE_URL,window.REFLORIA_SUPABASE_KEY);
const $=id=>document.getElementById(id);

async function start(){
 const {data}=await client.auth.getSession();
 if(data.session) showApp();
}
$("loginBtn").onclick=async()=>{
 const {error}=await client.auth.signInWithPassword({email:$("email").value,password:$("password").value});
 $("loginMsg").textContent=error?error.message:"ログイン成功";
 if(!error)showApp();
};
$("logout").onclick=async()=>{await client.auth.signOut();location.reload()};

function showApp(){
 $("login").style.display="none";$("app").style.display="block";loadEvent();loadDrivers();
}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{
 document.querySelectorAll("[data-tab]").forEach(x=>x.classList.remove("active"));b.classList.add("active");
 const drivers=b.dataset.tab==="drivers";
 $("eventPanel").style.display=drivers?"none":"block";$("driversPanel").style.display=drivers?"block":"none";
});

async function loadEvent(){
 const {data,error}=await client.from("event_settings").select("*").order("id",{ascending:false}).limit(1).maybeSingle();
 if(error){$("eventMsg").textContent=error.message;return}
 if(!data)return;
 $("eventName").value=data.event_name||"";$("eventDate").value=data.event_date||"";$("eventTime").value=(data.event_time||"").slice(0,5);
 $("eventLocation").value=data.event_location||"";$("eventHost").value=data.host||"";$("eventPrize").value=data.prize||"";$("eventDescription").value=data.description||"";
}
$("eventForm").onsubmit=async e=>{
 e.preventDefault();
 const {data:old}=await client.from("event_settings").select("id").order("id",{ascending:false}).limit(1).maybeSingle();
 const p={event_name:$("eventName").value,event_date:$("eventDate").value,event_time:$("eventTime").value,event_location:$("eventLocation").value,host:$("eventHost").value,prize:$("eventPrize").value,description:$("eventDescription").value,updated_at:new Date().toISOString()};
 const q=old?client.from("event_settings").update(p).eq("id",old.id):client.from("event_settings").insert(p);
 const {error}=await q;$("eventMsg").textContent=error?error.message:"保存しました ✓";
};

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function loadDrivers(){
 const {data,error}=await client.from("drivers").select("*").order("id");
 if(error){$("driverMsg").textContent=error.message;return}
 $("driverList").innerHTML=data.map(d=>`<div class="driver"><b>#${esc(d.number||"—")}</b><strong>${esc(d.name)}</strong><span>${esc(d.car||"—")}</span><button onclick="deleteDriver(${d.id})">削除</button></div>`).join("")||"<p>選手がまだ登録されていません。</p>";
}
$("driverForm").onsubmit=async e=>{
 e.preventDefault();
 const {error}=await client.from("drivers").insert({number:$("driverNumber").value.trim(),name:$("driverName").value.trim(),car:$("driverCar").value.trim()});
 $("driverMsg").textContent=error?error.message:"選手を追加しました ✓";
 if(!error){e.target.reset();loadDrivers()}
};
async function deleteDriver(id){
 if(!confirm("この選手を削除しますか？"))return;
 const {error}=await client.from("drivers").delete().eq("id",id);
 if(error)$("driverMsg").textContent=error.message; else loadDrivers();
}
start();
</script>
</body>
</html>
