<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REFLORIA ADMIN — DATABASE</title>
<link rel="stylesheet" href="admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
</head>
<body>
<main>
<header><div><p>DATABASE CONTROL / STEP 2</p><h1>REFLORIA <em>ADMIN</em></h1></div><button id="logout" hidden>LOG OUT</button></header>

<section id="login" class="card">
<h2>ADMIN LOGIN</h2><p>管理者だけが大会情報を変更できます。</p>
<input id="email" type="email" placeholder="メールアドレス">
<input id="password" type="password" placeholder="パスワード">
<button id="loginBtn">LOGIN</button><p id="loginMsg"></p>
</section>

<section id="app" hidden>
<nav><button data-page="event" class="active">🏁 大会情報</button><button data-page="drivers">👤 選手管理</button></nav>

<div id="eventPage" class="card page">
<h2>次回開催</h2>
<form id="eventForm">
<div class="grid">
<label>イベント名<input id="eventName" required></label>
<label>開催日<input id="eventDate" type="date" required></label>
<label>開催時間<input id="eventTime" type="time" required></label>
<label>開催場所<input id="eventLocation" required></label>
<label>主催者<input id="eventHost"></label>
<label>賞金・タイトル<input id="eventPrize"></label>
</div>
<label>イベント内容<textarea id="eventDescription"></textarea></label>
<div class="checks">
<label><input id="driftOnly" type="checkbox"> ドリフト車限定</label>
<label><input id="tcsOff" type="checkbox"> TCS OFF推奨</label>
<label><input id="nonCustom" type="checkbox"> ノンカスのみ</label>
<label><input id="judgeReview" type="checkbox"> 審査員審査</label>
</div>
<button type="submit">DATABASE SAVE</button><span id="saveMsg"></span>
</form>
</div>

<div id="driversPage" class="card page" hidden>
<h2>選手管理</h2><p class="page-note">公開サイトには「番号・選手名・主な車種」の3項目だけ反映されます。</p>
<form id="driverForm" class="driverForm"><input id="driverNumber" placeholder="番号（例：7）" required><input id="driverName" placeholder="選手名" required><input id="driverCar" placeholder="主な車種（例：S15）" required><button>ADD DRIVER</button></form>
<div id="driverList"></div>
</div>
</section>
</main>
<script src="admin-v2.js"></script>
</body>
</html>
