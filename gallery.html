<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>REFLORIA GALLERY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Noto+Sans+JP:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#05060a;color:#f5f6fa;font-family:"Noto Sans JP",sans-serif}
header{height:64px;border-bottom:1px solid #20232e;display:flex;align-items:center;justify-content:space-between;padding:0 4vw}
.brand{font:900 20px Orbitron}.brand span{color:#8b5cff}.nav{display:flex;gap:25px;font:700 11px Orbitron}.nav a{color:#aeb4c5;text-decoration:none}.nav a:hover{color:#fff}
main{max-width:1510px;margin:auto;padding:70px 4vw 100px}.kicker{color:#a56cff;font:700 11px Orbitron;letter-spacing:3px;border-left:2px solid #8b5cff;padding-left:18px}
h1{font:900 clamp(55px,7vw,100px) Orbitron;margin:25px 0 12px;letter-spacing:-5px}h1 span{color:#8b5cff}
.desc{color:#aeb4c5;margin-bottom:50px}.section{margin-top:65px}.section h2{font:900 28px Orbitron;margin-bottom:22px}.section h2 span{color:#8b5cff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#0a0c12;border:1px solid #282c39;overflow:hidden}.card img{width:100%;height:260px;object-fit:cover;display:block}.card-info{padding:16px}.card-info small{color:#8b5cff;font:700 10px Orbitron}.card-info b{display:block;margin-top:6px}
.video-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}.video{background:#0a0c12;border:1px solid #282c39}.video iframe,.video video{width:100%;aspect-ratio:16/9;border:0;display:block;background:#000}.video-info{padding:16px}
.empty{border:1px dashed #303545;padding:35px;color:#7f8698}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.video-grid{grid-template-columns:1fr}.nav{gap:12px}}
@media(max-width:600px){header{padding:0 18px}.nav a:nth-child(n+5){display:none}main{padding:45px 18px}.grid{grid-template-columns:1fr}h1{letter-spacing:-3px}}
</style>
</head>
<body>
<header>
  <a class="brand" href="index.html" style="text-decoration:none;color:#fff">R <span>REFLORIA</span></a>
  <nav class="nav">
    <a href="index.html">HOME</a><a href="event.html">EVENT</a><a href="drivers.html">DRIVERS</a>
    <a href="tournament.html">TOURNAMENT</a><a href="result.html">RESULT</a><a href="gallery.html">GALLERY</a><a href="news.html">NEWS</a>
  </nav>
</header>
<main>
  <div class="kicker">GALLERY / MEDIA</div>
  <h1>GAL<span>LERY</span></h1>
  <div class="desc">大会の写真・ハイライトを掲載します。</div>

  <section class="section">
    <h2>EVENT <span>PHOTOS</span></h2>
    <div id="photos" class="grid"><div class="empty">写真を読み込み中...</div></div>
  </section>

  <section class="section">
    <h2>HIGH<span>LIGHTS</span></h2>
    <div id="videos" class="video-grid"><div class="empty">動画を読み込み中...</div></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const db=supabase.createClient(window.REFLORIA_SUPABASE_URL,window.REFLORIA_SUPABASE_KEY);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function youtube(url){
  try{
    const u=new URL(url);
    if(u.hostname.includes('youtube.com')){const id=u.searchParams.get('v');return id?'https://www.youtube.com/embed/'+id:null;}
    if(u.hostname==='youtu.be')return 'https://www.youtube.com/embed/'+u.pathname.slice(1);
  }catch(e){}
  return null;
}
function videoHtml(x){
  const yt=youtube(x.media_url);
  if(yt)return `<iframe src="${esc(yt)}" title="${esc(x.title)}" allowfullscreen></iframe>`;
  return `<video controls preload="metadata" ${x.thumbnail_url?'poster="'+esc(x.thumbnail_url)+'"':''} src="${esc(x.media_url)}"></video>`;
}
async function load(){
  const {data,error}=await db.from('gallery_media').select('*').order('sort_order',{ascending:true}).order('created_at',{ascending:false});
  if(error){document.getElementById('photos').innerHTML='<div class="empty">写真を読み込めませんでした。</div>';document.getElementById('videos').innerHTML='<div class="empty">動画を読み込めませんでした。</div>';return;}
  const photos=data.filter(x=>x.media_type==='photo'),videos=data.filter(x=>x.media_type==='video');
  document.getElementById('photos').innerHTML=photos.length?photos.map(x=>`<article class="card"><img loading="lazy" src="${esc(x.media_url)}" alt="${esc(x.title)}"><div class="card-info"><small>EVENT PHOTO</small><b>${esc(x.title||'REFLORIA DRIFT')}</b></div></article>`).join(''):'<div class="empty">まだ写真がありません。</div>';
  document.getElementById('videos').innerHTML=videos.length?videos.map(x=>`<article class="video">${videoHtml(x)}<div class="video-info"><small>HIGHLIGHT</small><b>${esc(x.title||'REFLORIA HIGHLIGHT')}</b></div></article>`).join(''):'<div class="empty">まだハイライト動画がありません。</div>';
}
load();
</script>
</body>
</html>
