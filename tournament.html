<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOURNAMENT | REFLORIA DRIFT CHAMPIONSHIP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.page{min-height:100vh;padding:135px 5vw 90px;background:radial-gradient(circle at 75% 10%,rgba(139,92,255,.14),transparent 32%),#06070b}
.head{border-left:2px solid #8b5cff;padding-left:20px;margin-bottom:35px}.k{font:800 10px Orbitron,sans-serif;color:#a879ff;letter-spacing:3px}.head h1{font:900 clamp(42px,6vw,78px) Orbitron,sans-serif;margin:10px 0}.head p{color:#9297a5}
.status{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:25px}.pill{border:1px solid rgba(255,255,255,.12);background:#0c0e14;padding:10px 13px;font:700 10px Orbitron,sans-serif;color:#c8ccd5}.pill b{color:#32c8ff}
.panel{background:#0c0e14;border:1px solid rgba(255,255,255,.1);padding:24px;margin-bottom:24px}.panel h2{margin:0 0 18px;font:900 24px Orbitron,sans-serif}
.table{width:100%;border-collapse:collapse}.table th,.table td{border:1px solid #252936;padding:10px;text-align:left}.table th{color:#a879ff;background:#080a0f}
.bracket-wrap{overflow-x:auto;padding-bottom:20px}.bracket{display:flex;gap:28px;min-width:max-content;align-items:flex-start}.round{width:220px}.round-title{font:800 10px Orbitron,sans-serif;color:#a879ff;letter-spacing:2px;margin-bottom:12px}.matches{display:flex;flex-direction:column;gap:16px}.match{background:#0c0e14;border:1px solid rgba(255,255,255,.11);border-left:2px solid #303442;overflow:hidden}.match.final{border-color:#8b5cff}.slot{padding:11px 12px;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid rgba(255,255,255,.08);font-size:12px}.slot:last-child{border-bottom:0}.slot.win{color:#fff;background:rgba(139,92,255,.12)}.winner{color:#32c8ff;font-weight:900}.empty{padding:35px;border:1px dashed rgba(255,255,255,.18);color:#9297a5}.third{margin-top:30px}.third .match{max-width:480px}.losers{margin-top:35px}.losers h2{font:900 24px Orbitron,sans-serif}.muted{color:#9297a5;font-size:12px}
@media(max-width:700px){.page{padding:110px 4vw 60px}.round{width:190px}.panel{padding:18px}}
</style>
</head>
<body>
<header class="site-header">
<a class="brand" href="index.html"><span>R</span><strong>REFLORIA</strong><small>DRIFT CHAMPIONSHIP</small></a>
<nav class="nav"><a href="index.html">HOME</a><a href="event.html">EVENT</a><a href="drivers.html">DRIVERS</a><a href="tournament.html" class="active">TOURNAMENT</a><a href="result.html">RESULT</a><a href="gallery.html">GALLERY</a><a href="news.html">NEWS</a></nav>
</header>
<main class="page">
<div class="head"><div class="k">TOURNAMENT / LIVE BRACKET</div><h1>TOURNAMENT</h1><p>管理画面で作成したトーナメントを公開サイトに表示します。</p></div>
<div id="status" class="status"></div>
<div id="root"><div class="empty">トーナメントを読み込み中...</div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(function(){
'use strict';
const URL_FALLBACK='https://sofeiqphjhtocnigrpsg.supabase.co';
const KEY_FALLBACK='sb_publishable_Mg7xnlC0bCfYkWjO6CAAZQ_sqaTXkBm';
const url=window.REFLORIA_SUPABASE_URL||URL_FALLBACK;
const key=window.REFLORIA_SUPABASE_KEY||KEY_FALLBACK;
const db=supabase.createClient(url,key);
const root=document.getElementById('root');
const status=document.getElementById('status');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function roundName(i,total){if(i===total-1)return'FINAL';if(i===total-2)return'SEMI FINAL';if(i===total-3)return'TOP 8';if(i===total-4)return'TOP 16';return'ROUND '+(i+1)}
function safeBracket(raw){
  if(!raw||typeof raw!=='object')return {rounds:[],thirdPlace:null,losers:[]};
  // 新管理画面の bracket_data をそのまま表示
  if(Array.isArray(raw.rounds))return raw;
  // 念のため旧形式にも対応
  return {rounds:[],thirdPlace:null,losers:[]};
}
function render(data){
 const b=safeBracket(data.bracket_data);
 const rounds=Array.isArray(b.rounds)?b.rounds:[];
 status.innerHTML='<div class="pill">PLAYERS <b>'+esc(b.playerCount||data.player_count||'-')+'</b></div><div class="pill">LOSERS BRACKET <b>'+(data.losers_bracket?'ON':'OFF')+'</b></div><div class="pill">3RD PLACE <b>'+(data.third_place_match?'ON':'OFF')+'</b></div>';
 let html='<section class="panel"><h2>'+esc(data.name||'REFLORIA DRIFT CHAMPIONSHIP')+'</h2><p class="muted">単走最高点順でシードされたトーナメントです。</p></section>';
 if(!rounds.length){html+='<section class="panel"><div class="empty">トーナメント表はまだ作成されていません。</div></section>';root.innerHTML=html;return;}
 html+='<section class="panel"><h2>トーナメント表</h2><div class="bracket-wrap"><div class="bracket">';
 rounds.forEach((r,ri)=>{
   const matches=Array.isArray(r.matches)?r.matches:[];
   html+='<section class="round"><div class="round-title">'+esc(roundName(ri,rounds.length))+'</div><div class="matches">';
   matches.forEach((m,mi)=>{
     const a=m&&m.a?m.a:'TBD', c=m&&m.b?m.b:'TBD';
     const aw=!!(m&&m.winner&&m.winner===m.a), bw=!!(m&&m.winner&&m.winner===m.b);
     html+='<div class="match '+(ri===rounds.length-1?'final':'')+'"><div class="slot '+(aw?'win':'')+'"><span>'+esc(a)+'</span><span class="winner">'+(aw?'WIN':'')+'</span></div><div class="slot '+(bw?'win':'')+'"><span>'+esc(c)+'</span><span class="winner">'+(bw?'WIN':'')+'</span></div></div>';
   });
   html+='</div></section>';
 });
 html+='</div></div>';
 if(b.thirdPlace){html+='<div class="third"><h2>🥉 3位決定戦</h2><div class="match"><div class="slot '+(b.thirdPlace.winner===b.thirdPlace.a&&b.thirdPlace.a?'win':'')+'"><span>'+esc(b.thirdPlace.a||'TBD')+'</span><span class="winner">'+(b.thirdPlace.winner===b.thirdPlace.a&&b.thirdPlace.a?'3RD':'')+'</span></div><div class="slot '+(b.thirdPlace.winner===b.thirdPlace.b&&b.thirdPlace.b?'win':'')+'"><span>'+esc(b.thirdPlace.b||'TBD')+'</span><span class="winner">'+(b.thirdPlace.winner===b.thirdPlace.b&&b.thirdPlace.b?'3RD':'')+'</span></div></div></div>'}
 html+='</section>';
 if(data.losers_bracket&&Array.isArray(b.losers)&&b.losers.length){
   html+='<section class="panel losers"><h2>LOSERS BRACKET / 敗者復活</h2><div class="bracket-wrap"><div class="bracket">';
   b.losers.forEach((r,ri)=>{html+='<section class="round"><div class="round-title">LOSERS '+(ri+1)+'</div><div class="matches">'+(Array.isArray(r.matches)?r.matches:[]).map(m=>'<div class="match"><div class="slot '+(m.winner&&m.winner===m.a?'win':'')+'">'+esc(m.a||'TBD')+'</div><div class="slot '+(m.winner&&m.winner===m.b?'win':'')+'">'+esc(m.b||'TBD')+'</div></div>').join('')+'</div></section>'}).join('');
   html+='</div></div></section>';
 }
 root.innerHTML=html;
}
async function load(){
 try{
  const r=await db.from('tournaments').select('*').order('updated_at',{ascending:false}).limit(1).maybeSingle();
  if(r.error)throw r.error;
  if(!r.data){root.innerHTML='<div class="empty">現在トーナメントはありません。</div>';status.innerHTML='';return;}
  render(r.data);
 }catch(e){
  console.error(e);
  root.innerHTML='<div class="empty">トーナメントを読み込めませんでした。<br><span class="muted">'+esc(e.message||e)+'</span></div>';
 }
}
load();
setInterval(load,5000);
})();
</script>
</body>
</html>
