<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REFLORIA TOURNAMENT</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#06070b;color:#f4f5f7;font-family:Arial,"Noto Sans JP",sans-serif}.wrap{max-width:1250px;margin:auto;padding:35px 20px}.brand{font-size:38px;font-weight:900;margin-bottom:28px}.brand span{color:#8b5cff}.panel{background:#0c0e14;border:1px solid #252936;padding:24px;margin-bottom:18px}.muted{color:#9297a5}.table{width:100%;border-collapse:collapse}.table th,.table td{border:1px solid #252936;padding:10px}.table th{color:#a879ff;background:#080a0f}.rounds{display:flex;gap:16px;overflow:auto}.round{min-width:210px}.match{background:#080a0f;border:1px solid #252936;padding:10px;margin-bottom:12px}.player{padding:8px;border:1px solid #252936;margin-top:5px}.winner{border-color:#32c8ff;color:#32c8ff}@media(max-width:600px){.brand{font-size:28px}}</style></head>
<body><div class="wrap"><div class="brand">REFLORIA <span>TOURNAMENT</span></div><div id="app">読み込み中...</div></div>
<script>
const db=supabase.createClient(window.REFLORIA_SUPABASE_URL,window.REFLORIA_SUPABASE_KEY),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),n=v=>Number(v||0).toFixed(2).replace(/\.00$/,'');
function bracket(b){if(!b?.rounds)return'<p class="muted">未生成</p>';let h='<div class="rounds">';b.rounds.forEach((r,i)=>{h+='<div class="round"><h3>ROUND '+(i+1)+'</h3>';r.matches.forEach((m,j)=>{h+='<div class="match"><small>MATCH '+(j+1)+'</small><div class="player '+(m.winner===m.a?'winner':'')+'">'+esc(m.a||'TBD')+'</div><div class="player '+(m.winner===m.b?'winner':'')+'">'+esc(m.b||'TBD')+'</div></div>'});h+='</div>'});h+='</div>';if(b.thirdPlace)h+='<h3>🥉 3位決定戦</h3><div class="match"><div class="player">'+esc(b.thirdPlace.a||'TBD')+'</div><div class="player">'+esc(b.thirdPlace.b||'TBD')+'</div></div>';return h}
(async()=>{let t=await db.from('tournaments').select('*').order('created_at',{ascending:false}).limit(1).maybeSingle();if(t.error||!t.data){app.innerHTML='<div class="panel">トーナメントがありません。</div>';return}let e=await db.from('tournament_entries').select('*').eq('tournament_id',t.data.id).order('solo_total',{ascending:false}).order('solo_highest',{ascending:false});let h='<section class="panel"><h1>'+esc(t.data.name)+'</h1><p class="muted">'+t.data.player_count+' DRIVERS / 単走順位からシード</p></section><section class="panel"><h2>単走ランキング</h2><table class="table"><tr><th>順位</th><th>選手</th><th>車両</th><th>合計</th><th>最高点</th></tr>';(e.data||[]).forEach((x,i)=>h+='<tr><td>'+(i+1)+'</td><td>'+esc(x.driver_name)+'</td><td>'+esc(x.car)+'</td><td>'+n(x.solo_total)+'</td><td>'+n(x.solo_highest)+'</td></tr>');h+='</table></section><section class="panel"><h2>トーナメント表</h2>'+bracket(t.data.bracket_data)+'</section>';app.innerHTML=h})()
</script></body></html>
