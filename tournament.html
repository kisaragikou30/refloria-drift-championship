<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOURNAMENT | REFLORIA DRIFT CHAMPIONSHIP</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.page{min-height:100vh;padding:135px 5vw 90px;background:radial-gradient(circle at 75% 10%,rgba(139,92,255,.14),transparent 32%),#06070b}
.head{border-left:2px solid #8b5cff;padding-left:20px;margin-bottom:35px}.k{font:800 10px Orbitron;color:#a879ff;letter-spacing:3px}.head h1{font:900 clamp(42px,6vw,78px) Orbitron;margin:10px 0}.head p{color:#9297a5}
.status{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:25px}.pill{border:1px solid rgba(255,255,255,.12);background:#0c0e14;padding:10px 13px;font:700 10px Orbitron;color:#c8ccd5}.pill b{color:#32c8ff}
.bracket-wrap{overflow-x:auto;padding-bottom:20px}.bracket{display:flex;gap:28px;min-width:max-content;align-items:stretch}.round{width:220px}.round-title{font:800 10px Orbitron;color:#a879ff;letter-spacing:2px;margin-bottom:12px}.matches{display:flex;flex-direction:column;gap:16px}.match{background:#0c0e14;border:1px solid rgba(255,255,255,.11);border-left:2px solid #303442;overflow:hidden}.match.final{border-color:#8b5cff}.slot{padding:11px 12px;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid rgba(255,255,255,.08);font-size:12px}.slot:last-child{border-bottom:0}.slot.win{color:#fff;background:rgba(139,92,255,.12)}.seed{font:700 9px Orbitron;color:#6f7482}.winner{color:#32c8ff;font-weight:900}.empty{padding:35px;border:1px dashed rgba(255,255,255,.18);color:#9297a5}.losers{margin-top:55px}.losers h2{font:900 28px Orbitron}.losers p{color:#9297a5}
@media(max-width:700px){.page{padding:110px 4vw 60px}.round{width:190px}}
</style></head><body>
<header class="site-header"><a class="brand" href="index.html"><span>R</span><strong>REFLORIA</strong><small>DRIFT CHAMPIONSHIP</small></a>
<nav class="nav"><a href="index.html">HOME</a><a href="event.html">EVENT</a><a href="drivers.html">DRIVERS</a><a href="tournament.html" class="active">TOURNAMENT</a><a href="result.html">RESULT</a><a href="gallery.html">GALLERY</a><a href="news.html">NEWS</a></nav></header>
<main class="page"><div class="head"><div class="k">TOURNAMENT / LIVE BRACKET</div><h1>TOURNAMENT</h1><p>管理画面で作成したトーナメントをリアルタイムで表示します。</p></div>
<div id="status" class="status"></div><div id="root"><div class="empty">トーナメントを読み込み中...</div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<script>
const db=supabase.createClient(window.REFLORIA_SUPABASE_URL,window.REFLORIA_SUPABASE_KEY);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function roundName(i,total){if(i===total-1)return'FINAL';if(i===total-2)return'SEMI FINAL';if(i===total-3)return'TOP 8';if(i===total-4)return'TOP 16';return'ROUND '+(i+1)}
function render(data){
 const b=data.bracket_data||{}, rounds=b.rounds||[];
 document.getElementById('status').innerHTML=`<div class="pill">PLAYERS <b>${b.playerCount||data.player_count}</b></div><div class="pill">LOSERS BRACKET <b>${data.losers_bracket?'ON':'OFF'}</b></div><div class="pill">3RD PLACE <b>${data.third_place_match?'ON':'OFF'}</b></div>`;
 let html='<div class="bracket-wrap"><div class="bracket">';
 rounds.forEach((r,ri)=>{
  html+=`<section class="round"><div class="round-title">${esc(roundName(ri,rounds.length))}</div><div class="matches">`;
  r.matches.forEach((m,mi)=>{
   const a=m.a||'BYE', c=m.b||'BYE', aw=m.winner===m.a&&m.a, bw=m.winner===m.b&&m.b;
   html+=`<div class="match ${ri===rounds.length-1?'final':''}">
   <div class="slot ${aw?'win':''}"><span>${esc(a)}</span><span class="winner">${aw?'WIN':''}</span></div>
   <div class="slot ${bw?'win':''}"><span>${esc(c)}</span><span class="winner">${bw?'WIN':''}</span></div></div>`;
  });
  html+='</div></section>';
 });
 html+='</div></div>';
 if(b.thirdPlace){html+=`<div class="losers"><h2>🥉 3RD PLACE MATCH</h2><p>${esc(b.thirdPlace.a||'TBD')} VS ${esc(b.thirdPlace.b||'TBD')}　→　${esc(b.thirdPlace.winner||'TBD')}</p></div>`}
 if(data.losers_bracket){html+=`<div class="losers"><h2>LOSERS BRACKET / 敗者復活</h2><p>敗者側トーナメントを表示しています。勝敗は管理画面から更新されます。</p><div class="bracket-wrap"><div class="bracket">${(b.losers||[]).map((r,i)=>`<section class="round"><div class="round-title">LOSERS ${i+1}</div><div class="matches">${r.matches.map(m=>`<div class="match"><div class="slot ${m.winner===m.a?'win':''}">${esc(m.a||'TBD')}</div><div class="slot ${m.winner===m.b?'win':''}">${esc(m.b||'TBD')}</div></div>`).join('')}</div></section>`).join('')}</div></div>`}
 document.getElementById('root').innerHTML=html;
}
async function load(){
 const {data,error}=await db.from('tournaments').select('*').order('updated_at',{ascending:false}).limit(1).maybeSingle();
 if(error||!data){document.getElementById('root').innerHTML='<div class="empty">現在トーナメントはありません。</div>';return}
 render(data);
}
load();setInterval(load,5000);
</script></body></html>
