<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REFLORIA ADMIN / TOURNAMENT</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#06070b;color:#f4f5f7;font-family:Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:35px 20px}.brand{font:900 38px Orbitron,Arial;margin-bottom:25px}.brand span{color:#8b5cff}.panel{background:#0c0e14;border:1px solid #252936;padding:24px;margin-bottom:18px}h2{margin-top:0}label{display:block;color:#9297a5;font-size:12px;margin:13px 0 6px}input,select{width:100%;padding:11px;background:#080a0f;border:1px solid #303442;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.full{grid-column:1/-1}button{padding:11px 16px;background:#8b5cff;color:#fff;border:0;font-weight:800;cursor:pointer}.danger{background:#551c28}.msg{color:#32c8ff;margin-top:10px}.hidden{display:none}.matches{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.m{background:#080a0f;border:1px solid #252936;padding:12px}.m strong{display:block;color:#a879ff;font-size:10px;margin-bottom:8px}.m button{width:100%;margin-top:6px;background:#171a24;border:1px solid #34384a}.m button.sel{border-color:#32c8ff;color:#32c8ff}.row{display:flex;gap:10px;align-items:center}.note{color:#9297a5;font-size:12px;line-height:1.7}@media(max-width:800px){.grid,.matches{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.matches{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<div class="brand">REFLORIA <span>TOURNAMENT ADMIN</span></div>
<section id="login" class="panel"><h2>ADMIN LOGIN</h2><div id="diag" class="note" style="margin-bottom:12px">Supabase接続を確認中...</div><label>メールアドレス</label><input id="email" type="email"><label>パスワード</label><input id="password" type="password"><button id="loginBtn">LOGIN</button><div id="loginMsg" class="msg"></div></section>
<div id="app" class="hidden">
<section class="panel"><div class="row"><h2 style="margin:0;flex:1">TOURNAMENT GENERATOR</h2><button id="logout" class="danger">LOGOUT</button></div>
<p class="note">人数を入力すると自動で枠を作ります。BYEは自動配置。3位決定戦と敗者復活はON/OFFできます。</p>
<form id="form" class="grid">
<div><label>参加人数</label><input id="count" type="number" min="2" max="64" value="10"></div>
<div><label>敗者復活</label><select id="losers"><option value="false">なし</option><option value="true">あり</option></select></div>
<div><label>3位決定戦</label><select id="third"><option value="true">あり</option><option value="false">なし</option></select></div>
<div class="full"><label>大会名</label><input id="name" value="REFLORIA DRIFT CHAMPIONSHIP"></div>
<div class="full">
<label>出場選手・順位</label>
<p class="note">上から順位順に入力します。例：1位 vs 8位、2位 vs 7位、3位 vs 6位、4位 vs 5位。人数を変更すると入力欄も自動調整されます。</p>
<div id="seedInputs" style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px"></div>
</div>
<div class="full"><button>トーナメントを生成 / 更新</button></div>
</form><div id="msg" class="msg"></div></section>
<section class="panel"><h2>出場選手</h2><div id="players" class="note">選手を読み込み中...</div></section>
<section class="panel"><h2>勝敗入力</h2><p class="note">勝った選手を押すと次のラウンドへ進みます。</p><div id="editor"></div></section>
</div></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let db = null, current = null, drivers = [];

  function msg(id, text, ok=false) {
    const el=$(id); if(!el) return;
    el.textContent=text;
    el.style.color=ok ? '#32c8ff' : '#ff8797';
  }
  function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
  function pow2(n){let p=1;while(p<n)p*=2;return p;}

  function makeBracket(list, losers, third){
    const size=pow2(list.length), seeds=[...list];
    while(seeds.length<size) seeds.push('BYE');
    const rounds=[]; let first=[];
    for(let i=0;i<size;i+=2){
      const a=seeds[i], b=seeds[i+1];
      first.push({a,b,winner:b==='BYE'?a:a==='BYE'?b:null});
    }
    rounds.push({matches:first});
    for(let count=size/2;count>1;count/=2){
      const r=[]; for(let i=0;i<count;i+=2) r.push({a:null,b:null,winner:null});
      rounds.push({matches:r});
    }
    const bracket={playerCount:list.length,rounds,thirdPlace:third?{a:null,b:null,winner:null}:null,losers:[]};
    if(losers){
      for(let count=Math.max(2,size/2);count>=2;count=Math.floor(count/2)){
        const matches=[]; for(let i=0;i<count/2;i++) matches.push({a:null,b:null,winner:null});
        bracket.losers.push({matches});
      }
    }
    advance(bracket);
    return bracket;
  }

  function advance(b){
    for(let ri=0;ri<b.rounds.length-1;ri++){
      const cur=b.rounds[ri], next=b.rounds[ri+1];
      cur.matches.forEach((m,mi)=>{
        const w=m.winner, n=Math.floor(mi/2), side=mi%2?'b':'a';
        next.matches[n][side]=w||null;
      });
    }
    if(b.thirdPlace && b.rounds.length>=2){
      const semi=b.rounds[b.rounds.length-2].matches;
      if(semi.length>=2){b.thirdPlace.a=semi[0].winner||null;b.thirdPlace.b=semi[1].winner||null;}
    }
  }

  function renderEditor(){
    const root=$('editor');
    if(!current){root.innerHTML='<p class="note">まだトーナメントがありません。</p>';return;}
    const b=current.bracket_data||{};
    let html='<div class="matches">';
    (b.rounds||[]).forEach((r,ri)=>r.matches.forEach((m,mi)=>{
      html+=`<div class="m"><strong>ROUND ${ri+1} / MATCH ${mi+1}</strong>
      <button type="button" data-pick="${ri}:${mi}:a" class="${m.winner===m.a&&m.a?'sel':''}">${esc(m.a||'TBD')}</button>
      <button type="button" data-pick="${ri}:${mi}:b" class="${m.winner===m.b&&m.b?'sel':''}">${esc(m.b||'TBD')}</button></div>`;
    }));
    html+='</div>';
    if(b.thirdPlace) html+=`<div class="panel" style="margin-top:15px"><h3>🥉 3位決定戦</h3>
      <div class="m"><button type="button" data-third="a">${esc(b.thirdPlace.a||'TBD')}</button>
      <button type="button" data-third="b">${esc(b.thirdPlace.b||'TBD')}</button></div></div>`;
    root.innerHTML=html;

    root.querySelectorAll('[data-pick]').forEach(btn=>btn.addEventListener('click',async()=>{
      const [ri,mi,side]=btn.dataset.pick.split(':');
      const m=current.bracket_data.rounds[+ri].matches[+mi];
      const w=side==='a'?m.a:m.b;
      if(!w || w==='BYE' || w==='TBD'){msg('msg','まだ選手が決まっていません。');return;}
      m.winner=w; advance(current.bracket_data); await saveTournament(); renderEditor();
    }));
    root.querySelectorAll('[data-third]').forEach(btn=>btn.addEventListener('click',async()=>{
      const t=current.bracket_data.thirdPlace, w=btn.dataset.third==='a'?t.a:t.b;
      if(!w){msg('msg','3位決定戦の選手がまだ決まっていません。');return;}
      t.winner=w; await saveTournament(); renderEditor();
    }));
  }

  async function saveTournament(){
    const {data,error}=await db.from('tournaments').update({
      bracket_data:current.bracket_data,
      updated_at:new Date().toISOString()
    }).eq('id',current.id).select().single();
    if(error){msg('msg','保存失敗: '+error.message);return false;}
    current=data; msg('msg','保存しました ✓',true); return true;
  }

  async function loadDrivers(){
    const {data,error}=await db.from('drivers').select('number,name,car').order('id');
    if(error){msg('msg','選手読み込み失敗: '+error.message);return;}
    drivers=data||[];
    $('players').innerHTML=drivers.length
      ? drivers.map(d=>`#${esc(d.number||'—')} ${esc(d.name)} / ${esc(d.car||'—')}`).join('<br>')
      : '選手がいません。先にDRIVERSから登録してください。';
  }

  async function loadCurrent(){
    const {data,error}=await db.from('tournaments').select('*').order('updated_at',{ascending:false}).limit(1).maybeSingle();
    if(error){msg('msg','トーナメント読み込み失敗: '+error.message);return;}
    current=data||null;
    if(current){
      $('count').value=current.player_count||10;
      $('name').value=current.name||'REFLORIA DRIFT CHAMPIONSHIP';
      $('losers').value=String(!!current.losers_bracket);
      $('third').value=String(!!current.third_place_match);
    }
    renderSeedInputs();
    renderEditor();
  }

  async function openApp(){
    $('login').classList.add('hidden');
    $('app').classList.remove('hidden');
    await loadDrivers();
    await loadCurrent();
  }

  async function boot(){
    try{
      if(!window.supabase){throw new Error('Supabaseライブラリが読み込めていません。');}
      if(!window.REFLORIA_SUPABASE_URL || !window.REFLORIA_SUPABASE_KEY){
        throw new Error('supabase-config.js が読み込めていません。');
      }
      db=window.supabase.createClient(window.REFLORIA_SUPABASE_URL,window.REFLORIA_SUPABASE_KEY);
      $('diag').textContent='Supabase接続OK';
      const {data,error}=await db.auth.getSession();
      if(error) throw error;
      if(data.session) await openApp();
    }catch(e){
      $('diag').textContent='エラー: '+e.message;
    }
  }

  $('loginBtn').addEventListener('click',async()=>{
    try{
      $('loginBtn').disabled=true;
      msg('loginMsg','ログイン中...',true);
      const {data,error}=await db.auth.signInWithPassword({
        email:$('email').value.trim(),password:$('password').value
      });
      if(error) throw error;
      msg('loginMsg','ログイン成功 ✓',true);
      await openApp();
    }catch(e){msg('loginMsg',e.message);}
    finally{$('loginBtn').disabled=false;}
  });

  $('logout').addEventListener('click',async()=>{
    await db.auth.signOut(); location.reload();
  });

  function renderSeedInputs(){
  const n=Math.max(2,Math.min(64,Number($('count').value)||2));
  const root=$('seedInputs');
  const oldVals=[...root.querySelectorAll('input')].map(x=>x.value);
  root.innerHTML='';
  for(let i=0;i<n;i++){
    const wrap=document.createElement('div');
    wrap.innerHTML=`<div style="color:#a879ff;font-size:11px;font-weight:800;margin-bottom:5px">#${i+1} 順位</div>
      <input class="seed-player" data-seed="${i+1}" placeholder="${i+1}位の選手名" value="${esc(oldVals[i]||'')}">`;
    root.appendChild(wrap);
  }
}
$('count').addEventListener('input',renderSeedInputs);

$('form').addEventListener('submit',async e=>{
  e.preventDefault();
  try{
    const n=Math.max(2,Math.min(64,Number($('count').value)||2));
    const names=[...document.querySelectorAll('.seed-player')].map(x=>x.value.trim());
    if(names.length!==n) throw new Error('選手入力欄を確認してください。');
    if(names.some(x=>!x)) throw new Error('すべての順位に選手名を入力してください。');
    const unique=new Set(names);
    if(unique.size!==names.length) throw new Error('同じ選手名が複数あります。');

    // 1位 vs 8位, 2位 vs 7位, ... のシード順を作る
    const seeded=[];
    for(let i=0;i<Math.ceil(n/2);i++){
      const j=n-1-i;
      seeded.push(names[i]);
      if(j!==i) seeded.push(names[j]);
    }

    const payload={
      name:$('name').value.trim()||'TOURNAMENT',
      player_count:n,
      losers_bracket:$('losers').value==='true',
      third_place_match:$('third').value==='true',
      bracket_data:makeBracket(seeded,$('losers').value==='true',$('third').value==='true'),
      updated_at:new Date().toISOString()
    };
    let res;
    if(current) res=await db.from('tournaments').update(payload).eq('id',current.id).select().single();
    else res=await db.from('tournaments').insert(payload).select().single();
    if(res.error) throw res.error;
    current=res.data;
    renderEditor();
    msg('msg','トーナメントを生成しました ✓　シード順で対戦を組みました。',true);
  }catch(e){msg('msg','生成失敗: '+e.message);}
});

renderSeedInputs();

boot();
})();
</script></body></html>
