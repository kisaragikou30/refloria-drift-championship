<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REFLORIA RESULT</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#06070b;color:#f4f5f7;font-family:Arial,"Noto Sans JP",sans-serif}.wrap{max-width:1200px;margin:auto;padding:35px 20px}.brand{font-size:38px;font-weight:900}.brand span{color:#8b5cff}.panel{background:#0c0e14;border:1px solid #252936;padding:22px;margin:18px 0}.table{width:100%;border-collapse:collapse}.table th,.table td{border:1px solid #252936;padding:9px}.table th{color:#a879ff}.muted{color:#9297a5}.pill{display:inline-block;border:1px solid #303442;padding:8px;margin:4px}.win{color:#32c8ff}@media(max-width:600px){.brand{font-size:28px}}</style></head><body><div class="wrap"><div class="brand">REFLORIA <span>RESULT</span></div><div id="app">読み込み中...</div></div>
<script>
const db=supabase.createClient(window.REFLORIA_SUPABASE_URL,window.REFLORIA_SUPABASE_KEY),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),n=v=>Number(v||0).toFixed(2).replace(/\.00$/,'');
function finals(b){let a=[];if(!b?.rounds)return a;let f=b.rounds.at(-1)?.matches?.[0];if(f?.winner){a.push([1,f.winner]);let r=f.a===f.winner?f.b:f.a;if(r)a.push([2,r])}if(b.thirdPlace?.winner)a.push([3,b.thirdPlace.winner]);return a}
(async()=>{let t=await db.from('tournaments').select('*').order('created_at',{ascending:false});if(t.error){app.innerHTML='<div class="panel">'+esc(t.error.message)+'</div>';return}let h='';for(const x of t.data||[]){let e=await db.from('tournament_entries').select('*').eq('tournament_id',x.id).order('solo_total',{ascending:false}).order('solo_highest',{ascending:false});h+='<section class="panel"><h2>'+esc(x.name)+'</h2><p class="muted">'+x.player_count+' DRIVERS</p><h3>単走結果</h3><table class="table"><tr><th>順位</th><th>選手</th><th>合計</th><th>最高点</th></tr>';(e.data||[]).forEach((r,i)=>h+='<tr><td>'+(i+1)+'</td><td>'+esc(r.driver_name)+'</td><td>'+n(r.solo_total)+'</td><td>'+n(r.solo_highest)+'</td></tr>');h+='</table><h3>トーナメント最終結果</h3>';finals(x.bracket_data).forEach(p=>h+='<span class="pill '+(p[0]===1?'win':'')+'">'+p[0]+'位 '+esc(p[1])+'</span>');h+='</section>'}app.innerHTML=h||'<div class="panel muted">結果がありません。</div>'})()
</script></body></html>
