<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DRIVERS | REFLORIA DRIFT CHAMPIONSHIP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body{background:#06070b;color:#fff}
.drivers-page{min-height:100vh;padding:125px 6vw 100px}
.page-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:45px}
.kicker{font:700 11px Orbitron,sans-serif;letter-spacing:3px;color:#a879ff}
.kicker:before{content:"";display:inline-block;width:28px;height:1px;background:#32c8ff;vertical-align:middle;margin-right:10px}
h1{font:900 clamp(42px,6vw,82px) Orbitron,sans-serif;letter-spacing:-3px;margin:15px 0 0}
h1 span{color:#8b5cff}
.view-all{font:700 10px Orbitron,sans-serif;letter-spacing:1.5px;color:#fff;text-decoration:none;border-bottom:1px solid #555;padding-bottom:8px}
#driversGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.driver-card{background:#0c0e14;border:1px solid rgba(255,255,255,.11);position:relative;overflow:hidden;min-height:330px;transition:.25s}
.driver-card:hover{transform:translateY(-5px);border-color:#8b5cff}
.driver-visual{height:210px;background:radial-gradient(circle at 70% 30%,#2a2a4d,#11131b 45%,#07080c);position:relative;overflow:hidden}.driver-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:.92;filter:saturate(.9);z-index:1}.driver-photo-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,6,10,.05) 15%,rgba(5,6,10,.35) 65%,rgba(5,6,10,.92) 100%);z-index:2}
.driver-visual:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 20%,rgba(139,92,255,.2),transparent 70%)}
.driver-number{position:absolute;right:12px;bottom:-8px;font:900 76px Orbitron,sans-serif;color:rgba(255,255,255,.06);z-index:2}
.driver-info{padding:18px}
.driver-info small{font:700 9px Orbitron,sans-serif;color:#8b5cff;letter-spacing:2px}
.driver-info h2{font:900 22px "Noto Sans JP",sans-serif;margin:7px 0 5px}
.driver-info p{font:600 11px Orbitron,sans-serif;color:#9ba0ad;margin:0}
.empty{border:1px dashed rgba(255,255,255,.18);padding:35px;color:#9297a5}
@media(max-width:1000px){#driversGrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.drivers-page{padding:105px 5vw 60px}.page-top{display:block}.view-all{display:inline-block;margin-top:20px}#driversGrid{grid-template-columns:1fr}}

.points-section{margin-top:70px}.points-heading{display:flex;justify-content:space-between;gap:30px;align-items:end;margin-bottom:22px}.points-heading h2{font:900 clamp(30px,4vw,58px)/1 Orbitron,sans-serif;margin:10px 0}.points-heading h2 span{color:#8b5cff}.points-heading p{color:#9ba0ad;margin:0 0 8px}.points-table{border:1px solid rgba(255,255,255,.1);background:#0a0c12}.point-item{display:grid;grid-template-columns:70px 1fr 150px 110px;gap:18px;align-items:center;padding:18px 22px;border-bottom:1px solid rgba(255,255,255,.07)}.point-item:last-child{border-bottom:0}.point-rank{font:900 24px Orbitron;color:#8b5cff}.point-name{font-weight:900;font-size:18px}.point-sub{font-size:11px;color:#8e94a3;margin-top:4px}.point-total{font:900 24px Orbitron;text-align:right}.point-label{text-align:right;font:700 9px Orbitron;color:#7f8593;letter-spacing:2px}@media(max-width:700px){.points-heading{display:block}.point-item{grid-template-columns:50px 1fr 90px;gap:10px;padding:14px}.point-label{display:none}.point-total{font-size:18px}}
</style>
</head>
<body>
<header class="site-header">

<main class="drivers-page">
  <div class="page-top">
    <div>
      <div class="kicker">02 / DRIVERS</div>
      <h1>MEET THE <span>DRIVERS</span></h1>
    </div>
    <a class="view-all" href="drivers.html">VIEW ALL DRIVERS ↗</a>
  </div>

  <div id="driversGrid">
    <div class="empty">DRIVERSを読み込み中...</div>
  </div>
<section class="points-section"><div class="points-heading"><div><div class="kicker">03 / POINTS</div><h2>POINT <span>RANKING</span></h2></div><p>各大会の1位・2位・3位ポイントを合計したランキング。</p></div><div id="pointsTable" class="points-table"><div class="empty">POINTSを読み込み中...</div></div></section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
window.REFLORIA_SUPABASE_URL = "https://sofeiqphjhtocnigrpsg.supabase.co";
window.REFLORIA_SUPABASE_KEY = "sb_publishable_Mg7xnlC0bCfYkWjO6CAAZQ_sqaTXkBm";

const db = supabase.createClient(window.REFLORIA_SUPABASE_URL, window.REFLORIA_SUPABASE_KEY);

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

async function loadDrivers() {
  const grid = document.getElementById('driversGrid');
  const {data, error} = await db.from('drivers').select('id,number,name,car,photo_url,team').order('id', {ascending:true});
  if (error) {
    grid.innerHTML = '<div class="empty">選手情報を読み込めませんでした。</div>';
    console.error(error);
    return;
  }
  if (!data || !data.length) {
    grid.innerHTML = '<div class="empty">現在、登録されている選手はいません。</div>';
    return;
  }
  grid.innerHTML = data.map(d => `
    <article class="driver-card">
      <div class="driver-visual">
        ${d.photo_url ? `<img class="driver-photo" src="${esc(d.photo_url)}" alt="${esc(d.name || "driver")}" loading="lazy" onerror="this.style.display='none'">` : ""}
        <div class="driver-photo-shade"></div>
        <div class="driver-number">#${esc(d.number || '—')}</div>
      </div>
      <div class="driver-info">
        <small>DRIVER</small>
        <h2>${esc(d.name || 'NAME TBD')}</h2>
        <p>${esc(d.car || 'CAR TBD')}</p>
      </div>
    </article>
  `).join('');
}
async function loadPoints(){const el=document.getElementById("pointsTable");if(!el)return;const [{data:drivers,error:de},{data:points,error:pe}]=await Promise.all([db.from("drivers").select("id,number,name,car"),db.from("driver_event_points").select("driver_id,points")]);if(de||pe){el.innerHTML='<div class="empty">ポイントランキングを読み込めませんでした。</div>';return;}const map={};(points||[]).forEach(p=>{map[p.driver_id]=(map[p.driver_id]||0)+Number(p.points||0)});const rows=(drivers||[]).map(d=>({...d,total:map[d.id]||0})).filter(d=>d.total>0).sort((a,b)=>b.total-a.total||String(a.name).localeCompare(String(b.name)));el.innerHTML=rows.length?rows.map((d,i)=>`<div class="point-item"><div class="point-rank">${i+1}</div><div><div class="point-name">${esc(d.name)}</div><div class="point-sub">#${esc(d.number||"—")} ／ ${esc(d.car||"—")}</div></div><div class="point-total">${d.total}</div><div class="point-label">TOTAL POINTS</div></div>`).join(''):'<div class="empty">まだポイントが登録されていません。</div>';}
loadDrivers();
loadPoints();
</script>
</body>
